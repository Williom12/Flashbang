<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flash Test</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
    }

    #flash {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
    }

    #btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 36px;
        font-size: 18px;
        background: #2b2b2b;
        color: #ccc;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #btn:hover {
        background: #3a3a3a;
    }
</style>
</head>
<body>

<button id="btn">ACTIVAR</button>
<div id="flash"></div>

<script>
    const btn = document.getElementById("btn");
    const flash = document.getElementById("flash");

    btn.onclick = () => {
        if (!confirm("Esto mostrará un destello muy intenso.\n¿Continuar?")) return;

        flash.style.transition = "none";
        flash.style.opacity = "1";

        setTimeout(() => {
            flash.style.transition = "opacity 0.15s ease-out";
            flash.style.opacity = "0";
        }, 60);
    };
</script>

</body>
</html>
