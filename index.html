<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flash Test</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

/* Capa del flash */
#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}

/* Botón */
#btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 260px;        /* más largo */
    height: 60px;
    background: #2b2b2b; /* gris oscuro */
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#btn:hover {
    background: #3a3a3a;
}
</style>
</head>
<body>

<button id="btn"></button>
<div id="flash"></div>

<script>
const btn = document.getElementById("btn");
const flash = document.getElementById("flash");

btn.onclick = () => {
    flash.style.transition = "none";
    flash.style.opacity = "1";

    setTimeout(() => {
        flash.style.transition = "opacity 0.12s linear";
        flash.style.opacity = "0";
    }, 50);
};
</script>

</body>
</html>
